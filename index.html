<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PII Sanitizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo-box" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
        </div>
        <div class="header-title">
          <h1>PII Sanitizer</h1>
          <p class="subtitle">Processed locally. Nothing leaves your browser.</p>
        </div>
      </div>
      <div class="privacy-badge" role="status">
        <span class="pulse-dot" aria-hidden="true"></span>
        <span>100% Local - Offline Ready</span>
      </div>
    </header>

    <section class="controls" aria-label="Input and redaction controls">
      <div class="input-header">
        <label for="source-text" class="section-label">Input Payload</label>
        <div class="button-row">
          <label class="btn btn-secondary file-label" for="file-input">Upload .txt / .csv</label>
          <input id="file-input" type="file" accept=".txt,.csv" hidden>
          <button id="load-sample-btn" type="button" class="btn btn-secondary">Load sample</button>
          <button id="clear-btn" type="button" class="btn btn-ghost">Clear</button>
        </div>
      </div>

      <p id="file-warning" class="warning hidden" role="alert"></p>

      <textarea
        id="source-text"
        rows="7"
        placeholder="Paste text here or upload a .txt / .csv file..."
        spellcheck="false"
      ></textarea>

      <div class="mode-row">
        <span class="section-label">Redaction Mode</span>
        <fieldset class="mode-group">
          <legend class="sr-only">Redaction Mode</legend>
          <label class="radio-option">
            <input type="radio" name="redaction-mode" value="full" checked>
            <span>Full Mask</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="redaction-mode" value="partial">
            <span>Partial Mask</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="redaction-mode" value="pseudo">
            <span>Pseudonymize</span>
          </label>
        </fieldset>
      </div>
    </section>

    <section class="kpi-strip" aria-label="Audit metrics">
      <div class="kpi-card">
        <span class="kpi-label">Total PII Detected</span>
        <strong id="total-count" class="kpi-value kpi-amber">0</strong>
      </div>
      <div class="kpi-card kpi-wide">
        <span class="kpi-label">Category Breakdown</span>
        <div id="counts-list" class="counts-list"></div>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">False Positives Blocked</span>
        <strong id="luhn-rejected-count" class="kpi-value kpi-rose">0</strong>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">Privacy Guarantee</span>
        <strong class="kpi-value kpi-emerald">0 bytes sent</strong>
      </div>
    </section>

    <section class="panels" aria-label="Original and sanitized comparison">
      <div class="panel">
        <div class="panel-header">
          <h2>Original</h2>
        </div>
        <div id="original-view" class="panel-body"></div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2>Sanitized</h2>
          <div class="panel-actions">
            <button id="copy-btn" type="button" class="btn btn-secondary" disabled>Copy</button>
            <button id="download-btn" type="button" class="btn btn-primary" disabled>Download sanitized file</button>
          </div>
        </div>
        <div id="sanitized-view" class="panel-body"></div>
      </div>
    </section>

    <section id="mapping-section" class="mapping-section hidden" aria-label="Pseudonym mapping table">
      <h2>Pseudonym Mapping</h2>
      <div class="table-wrap">
        <table class="mapping-table">
          <thead>
            <tr>
              <th>Placeholder</th>
              <th>Original</th>
              <th>Type</th>
            </tr>
          </thead>
          <tbody id="mapping-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="js/detectors.js"></script>
  <script src="js/redact.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
